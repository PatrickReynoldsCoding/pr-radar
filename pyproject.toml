[project]
name = "pr-radar"
version = "0.1.0"
description = "Tracks your open GitHub PRs and alerts you when someone is waiting on you."
authors = [
    { name = "PatrickReynoldsCoding", email = "99245456+PatrickReynoldsCoding@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pr-radar = "pr_radar.__main__:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
